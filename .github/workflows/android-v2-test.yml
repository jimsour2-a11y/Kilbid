name: DOLD Android v2 TEST CI

on:
  push:
    branches: [ "android-v2-a1-test" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4

      - name: Check A1 package reference tests
        run: python3 -m unittest discover -s tests/v2_package -p 'test_*.py' -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Android Java (TEST CI only)
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Run Android JVM unit tests (A2 will add tests)
        run: gradle --no-daemon :app:testDebugUnitTest
