name: Build DOLD TechControl APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DOLD-TechControl-v0.5.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOLD-TechControl-v0.5.5-debug
          path: DOLD-TechControl-v0.5.5-debug.apk
