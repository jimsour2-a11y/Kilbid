plugins {
    id 'com.android.application'
}

android {
    namespace 'ee.dold.techcontrol'
    compileSdk 35

    defaultConfig {
        applicationId "ee.dold.techcontrol"
        minSdk 26
        targetSdk 35
        versionCode 58
        versionName "0.5.7"
    }

    buildTypes {
        debug {
            // TEST branch only: the engineering APK installs beside production v1.
            applicationIdSuffix '.integratedtest'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation project(':v2reader')
    implementation project(':v2storage')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
