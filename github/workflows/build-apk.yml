name: Build Kilbikontroll APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o Kilbikontroll_Android_v0.5.0_project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kilbikontroll-v0.5.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kilbikontroll-v0.5.0-debug
          path: Kilbikontroll-v0.5.0-debug.apk
